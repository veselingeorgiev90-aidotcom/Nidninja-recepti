name: Ninja recipe approval
run-name: "Review Ninja recipe"
on:
  workflow_dispatch:
    inputs:
      recipe_json:
        description: 'Recipe JSON with name, ingredients, steps, mode, temp, time, category'
        required: true
        type: string
permissions:
  contents: write
  pull-requests: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare draft recipe
        env:
          RECIPE_JSON: ${{ inputs.recipe_json }}
        run: python3 .github/scripts/prepare_recipe.py
      - name: Create approval pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No new recipe: identical recipe already exists.'
            exit 0
          fi
          BRANCH="ninja-recipe-${{ github.run_id }}-${{ github.run_attempt }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add index.html
          git commit -m "Prepare Ninja recipe for approval"
          git push origin "$BRANCH"
          gh pr create --base "${{ github.event.repository.default_branch }}" --head "$BRANCH" --title "🍳 Ninja: нова рецепта за одобрение" --body "Рецептата е подготвена, но НЕ е публикувана. Прегледай промените и одобри чрез Merge pull request. Ако не желаеш да я публикуваш, затвори заявката."
